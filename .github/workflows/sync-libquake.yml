name: Sync libquake Binaries

on:
  repository_dispatch:
    types: [libquake-release]
  workflow_dispatch: # Manual trigger option
    inputs:
      version:
        description: "libquake version (leave empty for latest)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest libquake release
        id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event.action }}" = "libquake-release" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION=$(gh release view --repo QuakeKit/libquake --json tagName -q .tagName)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download libquake binaries
        run: |
          mkdir -p temp
          cd temp

          # Check what assets are available
          echo "Checking assets for release ${{ steps.release.outputs.version }}..."
          gh release view ${{ steps.release.outputs.version }} \
            --repo QuakeKit/libquake \
            --json assets -q '.assets[].name'

          # Download available assets
          gh release download ${{ steps.release.outputs.version }} \
            --repo QuakeKit/libquake \
            --pattern "libquake-*.zip" || {
            echo "Error: No assets found matching pattern libquake-*.zip"
            echo "Please ensure the release has the required platform binaries:"
            echo "  - libquake-linux.zip"
            echo "  - libquake-macos.zip"
            echo "  - libquake-win.zip"
            exit 1
          }

          # Verify we got the expected files
          echo "Downloaded files:"
          ls -lh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and organize binaries
        run: |
          TARGET_DIR="com.quakekit.unity/Editor/NativeBindings/Libs"
          mkdir -p "$TARGET_DIR"/{linux,macos,win}

          # Linux
          unzip -o -j temp/libquake-linux.zip "lib/*" -d "$TARGET_DIR/linux/"

          # macOS  
          unzip -o -j temp/libquake-macos.zip "lib/*" -d "$TARGET_DIR/macos/"

          # Windows - try lib/* first, fallback to all .dll files if that fails
          unzip -o -j temp/libquake-win.zip "lib/*" -d "$TARGET_DIR/win/" 2>/dev/null || \
            unzip -o -j temp/libquake-win.zip "*.dll" -d "$TARGET_DIR/win/"

          rm -rf temp

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add com.quakekit.unity/Editor/NativeBindings/Libs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update libquake binaries to ${{ steps.release.outputs.version }}"
            git push
          fi
